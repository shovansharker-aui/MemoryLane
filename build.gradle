plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.memorylane.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.memorylane.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Uses the debug keystore just so the APK can be installed
            // directly for testing/sharing. For an actual Play Store
            // release you'd set up a real signing key instead.
            signingConfig signingConfigs.debug
        }
    }

    // Most native libraries here (ML Kit, ExoPlayer, osmdroid) ship a
    // separate .so file per CPU architecture. Building only for arm64-v8a
    // — which covers virtually every phone sold since ~2019 — drops the
    // other three copies entirely, which is often the single biggest win
    // for APK size.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // On-device AI: scene/content labeling + face detection (no Firebase account needed)
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // Reads photo capture date + GPS location from EXIF metadata
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Free, open-source map (OpenStreetMap) — no API key required, unlike Google Maps
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
