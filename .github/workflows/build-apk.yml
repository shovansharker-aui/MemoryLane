name: Build APK

# Every push to main builds a size-optimized release APK (code/resource
# shrinking + arm64-only) AND publishes it to the Releases section
# automatically — each build gets its own release, auto-numbered
# (build-1, build-2, ...) unless you push an actual version tag like
# v1.0.0, in which case that tag name is used instead.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK (shrunk, arm64-only)
        run: ./gradlew assembleRelease

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-lane-release-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Determine release tag name
        id: tagname
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagname.outputs.tag }}
          name: ${{ steps.tagname.outputs.tag }}
          files: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          generate_release_notes: true
