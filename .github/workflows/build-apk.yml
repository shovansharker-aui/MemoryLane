name: Build APK

# Every push to main builds a size-optimized release APK AND publishes it
# to the Releases section. Before publishing, ALL previous releases (and
# their tags) are deleted, so only the most recent build is ever kept.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK (shrunk, arm64-only)
        run: ./gradlew assembleRelease

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-lane-release-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Determine release tag name
        id: tagname
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # Deletes every existing release AND its tag, so the repo only ever
      # keeps the single most recent build. "|| true" on each line means
      # this doesn't fail the workflow the very first time, when there's
      # nothing yet to delete.
      - name: Delete all previous releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' | \
            xargs -r -I{} gh release delete {} --cleanup-tag --yes || true

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagname.outputs.tag }}
          name: ${{ steps.tagname.outputs.tag }}
          files: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          generate_release_notes: true
