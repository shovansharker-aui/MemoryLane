name: Build APK

# Every push to main builds a debug APK AND publishes it to the Releases
# section automatically — each build gets its own release, auto-numbered
# (build-1, build-2, ...) unless you push an actual version tag like v1.0.0,
# in which case that tag name is used instead.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-lane-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Decide the release's tag name: if this run was triggered by pushing
      # an actual version tag (e.g. v1.0.0), use that. Otherwise, this was
      # a normal push to main, so auto-generate one like "build-42" using
      # GitHub's own run number, which always increases.
      - name: Determine release tag name
        id: tagname
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagname.outputs.tag }}
          name: ${{ steps.tagname.outputs.tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
